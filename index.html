<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Review Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: white;
      padding: 20px;
    }

    .business-card {
      background: linear-gradient(135deg, #4f46e5, #6d5dfc);
      color: white;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 22px;
    }

    .business-name {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .business-subtitle {
      font-size: 14px;
      opacity: 0.9;
    }

    h2 {
      font-size: 19px;
      margin: 20px 0 12px;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 15px 0 25px;
    }

    .star {
      border: none;
      background: #f1f1f1;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      font-size: 27px;
      cursor: pointer;
    }

    .star.selected {
      background: #fff1b8;
    }

    .experiences {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .experience {
      border: 1px solid #ddd;
      background: white;
      padding: 11px 15px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 14px;
    }

    .experience.selected {
      background: #eeeaff;
      border-color: #5b4df5;
      color: #4b3de0;
    }

    .generate-btn,
    .copy-btn,
    .google-btn {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
    }

    .generate-btn {
      background: #111;
      color: white;
    }

    .copy-btn {
      background: #4f46e5;
      color: white;
    }

    .google-btn {
      background: #34a853;
      color: white;
    }

    .review-box {
      width: 100%;
      min-height: 130px;
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 13px;
      resize: vertical;
      font-size: 15px;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }

    .note {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 18px;
      line-height: 1.5;
    }

    .loading {
      text-align: center;
      margin-top: 15px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="business-card">
    <div class="business-name" id="businessName">
      Sharma Restaurant
    </div>

    <div class="business-subtitle">
      Share your genuine experience
    </div>
  </div>

  <h2>How was your experience?</h2>

  <div class="stars">
    <button class="star" onclick="selectRating(1)">⭐</button>
    <button class="star" onclick="selectRating(2)">⭐</button>
    <button class="star" onclick="selectRating(3)">⭐</button>
    <button class="star" onclick="selectRating(4)">⭐</button>
    <button class="star" onclick="selectRating(5)">⭐</button>
  </div>

  <h2>What did you experience?</h2>

  <div class="experiences">

    <button class="experience" onclick="toggleExperience(this)">
      Staff
    </button>

    <button class="experience" onclick="toggleExperience(this)">
      Service
    </button>

    <button class="experience" onclick="toggleExperience(this)">
      Quality
    </button>

    <button class="experience" onclick="toggleExperience(this)">
      Price
    </button>

    <button class="experience" onclick="toggleExperience(this)">
      Cleanliness
    </button>

    <button class="experience" onclick="toggleExperience(this)">
      Overall
    </button>

  </div>

  <button class="generate-btn" onclick="generateReview()">
    Generate Review
  </button>

  <div id="loading" class="loading hidden">
    Creating your review...
  </div>

  <div id="reviewSection" class="hidden">

    <h2>Your Review</h2>

    <textarea id="reviewText" class="review-box"></textarea>

    <button class="copy-btn" onclick="copyAndContinue()">
      📋 Copy Review & Continue
    </button>

    <button class="google-btn" onclick="openGoogleReview()">
      ⭐ Google par Review Karein
    </button>

  </div>

  <div class="note">
    Your review should reflect your genuine experience.
    You can edit the review before posting.
  </div>

</div>


<script>

  let selectedRating = 0;
  let selectedExperiences = [];

  // Temporary Google review link.
  // Later this will come automatically from Supabase.
  let googleReviewUrl = "#";


  function selectRating(rating) {

    selectedRating = rating;

    const stars = document.querySelectorAll(".star");

    stars.forEach((star, index) => {

      if (index < rating) {
        star.classList.add("selected");
      } else {
        star.classList.remove("selected");
      }

    });

  }


  function toggleExperience(button) {

    const experience = button.innerText.trim();

    button.classList.toggle("selected");

    if (selectedExperiences.includes(experience)) {

      selectedExperiences =
        selectedExperiences.filter(item => item !== experience);

    } else {

      selectedExperiences.push(experience);

    }

  }


  async function generateReview() {

    if (selectedRating === 0) {
      alert("Please select a rating first.");
      return;
    }

    if (selectedExperiences.length === 0) {
      alert("Please select at least one experience.");
      return;
    }

    document.getElementById("loading").classList.remove("hidden");

    document.getElementById("reviewSection").classList.add("hidden");


    /*
      Later this request will go to our secure Vercel backend.
      The backend will send the information to Gemini AI.
    */

    try {

      const response = await fetch("/api/generate-review", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          businessName:
            document.getElementById("businessName").innerText,

          rating: selectedRating,

          experiences: selectedExperiences

        })

      });


      if (!response.ok) {
        throw new Error("API not ready");
      }


      const data = await response.json();

      document.getElementById("reviewText").value =
        data.review;

    } catch (error) {

      /*
        Temporary fallback.
        The real AI version will replace this
        after we connect Gemini.
      */

      document.getElementById("reviewText").value =
        createTemporaryReview();

    }


    document.getElementById("loading").classList.add("hidden");

    document.getElementById("reviewSection").classList.remove("hidden");

  }


  function createTemporaryReview() {

    const ratingText = {

      1: "I was not very satisfied with my experience.",
      2: "My experience was okay, but there is room for improvement.",
      3: "Overall, I had an average experience.",
      4: "I had a good experience overall.",
      5: "I had a great experience overall."

    };


    let experienceText =
      selectedExperiences.join(", ").toLowerCase();


    return ratingText[selectedRating] +
      " I especially noticed the " +
      experienceText +
      ".";
  }


  async function copyAndContinue() {

    const review =
      document.getElementById("reviewText").value.trim();

    if (!review) {
      alert("Please generate a review first.");
      return;
    }

    try {

      await navigator.clipboard.writeText(review);

    } catch (error) {

      const textarea =
        document.getElementById("reviewText");

      textarea.select();

      document.execCommand("copy");

    }


    openGoogleReview();

  }


  function openGoogleReview() {

    if (googleReviewUrl === "#") {

      alert(
        "Google Review link will be connected after we set up the business database."
      );

      return;
    }

    window.open(
      googleReviewUrl,
      "_blank"
    );

  }

</script>

</body>
</html>
