<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Analytics | Review Assistant</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #f5f6fa;
      color: #171717;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 18px 60px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 6px 0 0;
      color: #737373;
      font-size: 14px;
    }

    .back-btn {
      text-decoration: none;
      background: #111827;
      color: white;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
    }

    .filter-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;

      display: flex;
      align-items: end;
      gap: 15px;
      flex-wrap: wrap;
    }

    .field {
      flex: 1;
      min-width: 220px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
    }

    .load-btn {
      border: none;
      background: #111827;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .load-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 13px 15px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #737373;
    }

    .summary-grid {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 15px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 20px;
    }

    .summary-card span {
      display: block;
      color: #737373;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .summary-card strong {
      display: block;
      font-size: 28px;
    }

    .table-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      overflow: hidden;
    }

    .table-header {
      padding: 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .table-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .table-header p {
      margin: 5px 0 0;
      color: #737373;
      font-size: 13px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
      text-align: left;
      font-size: 14px;
      white-space: nowrap;
    }

    th {
      background: #fafafa;
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
    }

    td strong {
      font-size: 14px;
    }

    .rating-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .rating {
      background: #f5f6fa;
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12px;
    }

    .empty {
      padding: 35px;
      text-align: center;
      color: #737373;
    }

    @media (max-width: 700px) {

      .page {
        padding: 22px 14px 40px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .filter-card {
        align-items: stretch;
      }

      .load-btn {
        width: 100%;
      }

    }

  </style>
</head>

<body>

  <main class="page">

    <div class="header">

      <div>
        <h1>📊 Analytics</h1>
        <p>Monthly Review Assistant activity</p>
      </div>

      <a
        href="/admin.html"
        class="back-btn"
      >
        ← Admin
      </a>

    </div>


    <div class="filter-card">

      <div class="field">

        <label for="month">
          Select Month
        </label>

        <input
          type="month"
          id="month"
        />

      </div>

      <button
        class="load-btn"
        id="loadBtn"
        type="button"
      >
        Load Analytics
      </button>

    </div>


    <div
      class="message error"
      id="errorMessage"
    ></div>


    <div
      id="loading"
      class="loading"
      style="display:none;"
    >
      Loading analytics...
    </div>


    <div
      id="analyticsContent"
      style="display:none;"
    >

      <div class="summary-grid">

        <div class="summary-card">
          <span>Total Page Visits</span>
          <strong id="totalPageViews">
            0
          </strong>
        </div>

        <div class="summary-card">
          <span>Total Reviews Generated</span>
          <strong id="totalReviews">
            0
          </strong>
        </div>

        <div class="summary-card">
          <span>Total Google Clicks</span>
          <strong id="totalGoogleClicks">
            0
          </strong>
        </div>

      </div>


      <div class="table-card">

        <div class="table-header">

          <h2>
            Business-wise Analytics
          </h2>

          <p id="selectedMonthText">
            —
          </p>

        </div>


        <div
          class="table-wrap"
          id="tableWrap"
        ></div>

      </div>

    </div>

  </main>


  <script>

    const SUPABASE_URL =
      "https://uhcbdclpavdgcrtultjc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_uEo2RjEGEYo3uo8e7DV03w_jdXejtrV";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const monthInput =
      document.getElementById("month");

    const loadBtn =
      document.getElementById("loadBtn");

    const errorMessage =
      document.getElementById("errorMessage");

    const loading =
      document.getElementById("loading");

    const analyticsContent =
      document.getElementById(
        "analyticsContent"
      );


    function getCurrentMonth() {

      const now = new Date();

      const year =
        now.getFullYear();

      const month =
        String(
          now.getMonth() + 1
        ).padStart(2, "0");

      return `${year}-${month}`;

    }


    monthInput.value =
      getCurrentMonth();


    function showError(message) {

      errorMessage.textContent =
        message;

      errorMessage.classList.add(
        "show"
      );

    }


    function hideError() {

      errorMessage.classList.remove(
        "show"
      );

    }


    function formatNumber(number) {

      return Number(number || 0)
        .toLocaleString("en-IN");

    }


    function formatMonth(month) {

      const [year, monthNumber] =
        month.split("-");

      const date =
        new Date(
          Number(year),
          Number(monthNumber) - 1,
          1
        );

      return date.toLocaleDateString(
        "en-IN",
        {
          month: "long",
          year: "numeric"
        }
      );

    }


    async function loadAnalytics() {

      hideError();

      const month =
        monthInput.value;

      if (!month) {

        showError(
          "Please select a month."
        );

        return;
      }


      loadBtn.disabled = true;

      loadBtn.textContent =
        "Loading...";

      loading.style.display =
        "block";

      analyticsContent.style.display =
        "none";


      try {

        const {
          data: {
            session
          }
        } =
          await supabaseClient.auth
            .getSession();


        if (!session) {

          throw new Error(
            "Please login again."
          );

        }


        const response =
          await fetch(
            `/api/admin/analytics?month=${encodeURIComponent(month)}`,
            {
              headers: {
                "Authorization":
                  `Bearer ${session.access_token}`
              }
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Could not load analytics."
          );

        }


        const businesses =
          data.businesses || [];


        let totalPageViews = 0;
        let totalReviews = 0;
        let totalGoogleClicks = 0;


        businesses.forEach(
          (business) => {

            totalPageViews +=
              Number(
                business.page_views || 0
              );

            totalReviews +=
              Number(
                business.reviews_generated || 0
              );

            totalGoogleClicks +=
              Number(
                business.google_clicks || 0
              );

          }
        );


        document.getElementById(
          "totalPageViews"
        ).textContent =
          formatNumber(
            totalPageViews
          );


        document.getElementById(
          "totalReviews"
        ).textContent =
          formatNumber(
            totalReviews
          );


        document.getElementById(
          "totalGoogleClicks"
        ).textContent =
          formatNumber(
            totalGoogleClicks
          );


        document.getElementById(
          "selectedMonthText"
        ).textContent =
          formatMonth(month);


        if (businesses.length === 0) {

          document.getElementById(
            "tableWrap"
          ).innerHTML = `
            <div class="empty">
              No businesses found.
            </div>
          `;

        } else {

          document.getElementById(
            "tableWrap"
          ).innerHTML = `

            <table>

              <thead>

                <tr>

                  <th>Business</th>
                  <th>Visits</th>
                  <th>Generated</th>
                  <th>Google Clicks</th>
                  <th>Ratings</th>

                </tr>

              </thead>

              <tbody>

                ${businesses.map(
                  (business) => `

                    <tr>

                      <td>
                        <strong>
                          ${business.business_name}
                        </strong>
                      </td>

                      <td>
                        ${formatNumber(
                          business.page_views
                        )}
                      </td>

                      <td>
                        ${formatNumber(
                          business.reviews_generated
                        )}
                      </td>

                      <td>
                        ${formatNumber(
                          business.google_clicks
                        )}
                      </td>

                      <td>

                        <div class="rating-row">

                          <span class="rating">
                            5⭐
                            ${formatNumber(
                              business.rating_5
                            )}
                          </span>

                          <span class="rating">
                            4⭐
                            ${formatNumber(
                              business.rating_4
                            )}
                          </span>

                          <span class="rating">
                            3⭐
                            ${formatNumber(
                              business.rating_3
                            )}
                          </span>

                          <span class="rating">
                            2⭐
                            ${formatNumber(
                              business.rating_2
                            )}
                          </span>

                          <span class="rating">
                            1⭐
                            ${formatNumber(
                              business.rating_1
                            )}
                          </span>

                        </div>

                      </td>

                    </tr>

                  `
                ).join("")}

              </tbody>

            </table>

          `;

        }


        analyticsContent.style.display =
          "block";


      } catch (error) {

        showError(
          error.message ||
          "Something went wrong."
        );

      } finally {

        loading.style.display =
          "none";

        loadBtn.disabled = false;

        loadBtn.textContent =
          "Load Analytics";

      }

    }


    loadBtn.addEventListener(
      "click",
      loadAnalytics
    );


    // Automatically load selected month
    loadAnalytics();

  </script>

</body>

</html>
